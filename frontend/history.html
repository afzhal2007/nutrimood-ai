<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>History | NutriMood AI</title>

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <div class="bg-blur bg-blur-one"></div>
  <div class="bg-blur bg-blur-two"></div>
  <div class="bg-grid"></div>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <a href="dashboard.html" class="sidebar-logo">
        <img src="assets/logo.png" alt="NutriMood AI Logo" />
        <span>NutriMood AI</span>
      </a>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="side-link"><span>🏠</span>Dashboard</a>
        <a href="mood-check.html" class="side-link"><span>🧠</span>Mood Check</a>
        <a href="recommendations.html" class="side-link"><span>🥗</span>Recommendations</a>
        <a href="food-scanner.html" class="side-link"><span>🍱</span>Food Scanner</a>
        <a href="lucky-ai.html" class="side-link"><span>🤖</span>Lucky AI</a>
        <a href="history.html" class="side-link active"><span>📊</span>History</a>
        <a href="round-score.html" class="side-link"><span>🏆</span>Round Score</a>
        <a href="profile.html" class="side-link"><span>👤</span>Profile</a>
        <a href="settings.html" class="side-link"><span>⚙️</span>Settings</a>
      </nav>

      <div class="sidebar-bottom">
        <button class="theme-toggle dashboard-theme" id="themeToggle">
          <span>☀️</span><span class="toggle-ball"></span><span>🌙</span>
        </button>
        <button class="logout-btn" id="logoutBtn"><span>🚪</span>Logout</button>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <button class="dashboard-menu-btn" id="dashboardMenuBtn">
          <span></span><span></span><span></span>
        </button>

        <div>
          <p class="welcome-small">Saved activity</p>
          <h1>History 📊</h1>
        </div>

        <div class="topbar-actions">
          <button class="topbar-ai-btn" id="clearHistoryBtn">Clear History <span>🧹</span></button>
          <div class="profile-mini"><span id="profileInitial">A</span></div>
        </div>
      </header>

      <section class="dashboard-stats">
        <div class="dash-stat-card">
          <div class="dash-stat-icon green">🧠</div>
          <div><p>Mood Checks</p><h3 id="moodCount">0</h3></div>
        </div>

        <div class="dash-stat-card">
          <div class="dash-stat-icon purple">🥗</div>
          <div><p>Food Plans</p><h3 id="foodCount">0</h3></div>
        </div>

        <div class="dash-stat-card">
          <div class="dash-stat-icon cyan">🤖</div>
          <div><p>AI Chats</p><h3 id="chatCount">0</h3></div>
        </div>

        <div class="dash-stat-card">
          <div class="dash-stat-icon orange">🍱</div>
          <div><p>Scans</p><h3 id="scanCount">0</h3></div>
        </div>
      </section>

      <section class="dashboard-panel">
        <div class="panel-heading">
          <h2>All History</h2>
          <p>Your recent NutriMood AI activity.</p>
        </div>

        <div class="history-list" id="historyList">
          <div class="score-history-item">
            <span>No history yet</span>
            <strong>Start mood check</strong>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <button class="floating-bot" id="floatingLuckyBot" aria-label="Open Lucky AI">
    <span>🤖</span>
  </button>

  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
